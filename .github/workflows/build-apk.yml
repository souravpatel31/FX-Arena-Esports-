name: Build FX Arena Esports APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: Configure Public Web & APK Release URLs
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/FX-Arena-Esports.apk"

          if [ "$REPO_NAME" = "${REPO_OWNER}.github.io" ]; then
            PAGES_BASE_PATH="/"
            PUBLIC_SITE_URL="https://${REPO_OWNER}.github.io"
          else
            PAGES_BASE_PATH="/${REPO_NAME}/"
            PUBLIC_SITE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          fi

          {
            echo "VITE_APK_DOWNLOAD_URL=${APK_URL}"
            echo "VITE_PUBLIC_SITE_URL=${PUBLIC_SITE_URL}"
            echo "PAGES_BASE_PATH=${PAGES_BASE_PATH}"
          } >> "$GITHUB_ENV"

      - name: Build Web Assets for APK
        run: npm run build

      - name: Create Capacitor Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Apply FX Arena Esports Logo & Branding
        run: |
          python3 -c "import PIL" 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil)
          python3 - << 'EOF'
          import os, glob
          from PIL import Image, ImageDraw

          logo_path = "public/assets/aistudio/fx_arena_icon_512_8f7073a7.png"
          res_dir = "android/app/src/main/res"
          base_img = Image.open(logo_path).convert("RGBA")

          # Remove adaptive icon XMLs and vector foregrounds so custom PNG launcher icon is always shown cleanly
          for d in ["mipmap-anydpi-v26", "drawable-v24"]:
              target = os.path.join(res_dir, d)
              if os.path.isdir(target):
                  import shutil
                  shutil.rmtree(target)

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, px in sizes.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = base_img.resize((px, px), Image.LANCZOS)
              resized.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
              resized.save(os.path.join(out_dir, "ic_launcher_foreground.png"), "PNG")

              # Circular cropped version for ic_launcher_round.png
              mask = Image.new("L", (px, px), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, px, px), fill=255)
              round_img = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              round_img.paste(resized, (0, 0), mask)
              round_img.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")

          # Set Android OS native launch splash to centered Eagle logo on dark canvas so the 3s welcome poster only plays once inside the app
          for splash_file in glob.glob(os.path.join(res_dir, "drawable*", "splash.png")):
              w, h = Image.open(splash_file).size
              canvas = Image.new("RGBA", (w, h), (5, 5, 8, 255))
              icon_size = max(96, int(min(w, h) * 0.34))
              fitted = base_img.resize((icon_size, icon_size), Image.LANCZOS)
              canvas.paste(fitted, ((w - icon_size) // 2, (h - icon_size) // 2), fitted)
              canvas.save(splash_file, "PNG")
          print("Applied FX Arena Esports launcher icons and native splash logo successfully.")
          EOF

      - name: Configure Release SDK & Versioning
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import os, re

          vars_path = "android/variables.gradle"
          with open(vars_path, "r") as f:
              vars_txt = f.read()
          vars_txt = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 34", vars_txt)
          with open(vars_path, "w") as f:
              f.write(vars_txt)

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              gradle_txt = f.read()
          run_num = os.environ["RUN_NUM"]
          gradle_txt = re.sub(r"versionCode\s+\d+", f"versionCode {run_num}", gradle_txt)
          gradle_txt = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_num}"', gradle_txt)
          with open(gradle_path, "w") as f:
              f.write(gradle_txt)
          print(f"Configured targetSdkVersion=34, versionCode={run_num}, versionName=1.0.{run_num}")
          EOF

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode=none
          cd ..

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Release APK not found at $UNSIGNED_APK"
            exit 1
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" app-release-aligned.apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/fx-release.keystore
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            KS_PASS=$(openssl rand -hex 16)
            KEY_ALIAS="fxarena"
            KEY_PASS="$KS_PASS"
            keytool -genkeypair -v \
              -keystore /tmp/fx-release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=FX Arena Esports, OU=Mobile, O=FX Arena Esports, L=Delhi, ST=DL, C=IN"
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/fx-release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out FX-Arena-Esports.apk \
            app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose FX-Arena-Esports.apk
          ls -lh FX-Arena-Esports.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: FX-Arena-Esports-APK
          path: FX-Arena-Esports.apk

      - name: Publish Public APK Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FX Arena eSport v1.0.${{ github.run_number }}
          body: Official signed Release Android APK for FX Arena eSport. Uninstall any older version before installing FX-Arena-Esports.apk on your Android phone.
          files: FX-Arena-Esports.apk
          make_latest: true

      - name: Build Public Download Website (GitHub Pages)
        run: |
          rm -rf dist
          VITE_BASE_PATH="$PAGES_BASE_PATH" npm run build
          cp dist/index.html dist/404.html
          python3 - << 'EOF'
          import os, json, textwrap

          site_url = os.environ["VITE_PUBLIC_SITE_URL"].rstrip("/")
          base_path = os.environ["PAGES_BASE_PATH"]

          with open("dist/sitemap.xml", "w") as f:
              f.write(textwrap.dedent(f"""\
              <?xml version="1.0" encoding="UTF-8"?>
              <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
                <url>
                  <loc>{site_url}/</loc>
                  <changefreq>weekly</changefreq>
                  <priority>1.0</priority>
                </url>
                <url>
                  <loc>{site_url}/download</loc>
                  <changefreq>weekly</changefreq>
                  <priority>0.9</priority>
                </url>
              </urlset>
              """))

          with open("dist/robots.txt", "w") as f:
              f.write(textwrap.dedent(f"""\
              User-agent: *
              Allow: {base_path}
              Allow: {base_path}download
              Disallow: {base_path}admin
              Disallow: {base_path}admin/
              Disallow: {base_path}wallet
              Disallow: {base_path}profile

              Sitemap: {site_url}/sitemap.xml
              """))

          manifest_path = "dist/manifest.json"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  manifest = json.load(f)
              manifest["id"] = base_path
              manifest["start_url"] = base_path
              manifest["scope"] = base_path
              for icon in manifest.get("icons", []):
                  src = icon.get("src", "").lstrip("/")
                  if src:
                      icon["src"] = f"{base_path}{src}"
              with open(manifest_path, "w") as f:
                  json.dump(manifest, f, indent=2)
          EOF

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-pages:
    name: Deploy Public Website (GitHub Pages)
    needs: build-apk
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
