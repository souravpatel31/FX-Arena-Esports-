name: Build FX Arena Esports APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Create Capacitor Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Apply FX Arena Esports Logo & Branding
        run: |
          python3 -c "import PIL" 2>/dev/null || (sudo apt-get update && sudo apt-get install -y python3-pil)
          python3 - << 'EOF'
          import os, glob
          from PIL import Image, ImageDraw

          logo_path = "public/assets/aistudio/fx_arena_icon_512_8f7073a7.png"
          res_dir = "android/app/src/main/res"
          base_img = Image.open(logo_path).convert("RGBA")

          # Remove adaptive icon XMLs and vector foregrounds so custom PNG launcher icon is always shown cleanly
          for d in ["mipmap-anydpi-v26", "drawable-v24"]:
              target = os.path.join(res_dir, d)
              if os.path.isdir(target):
                  import shutil
                  shutil.rmtree(target)

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, px in sizes.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = base_img.resize((px, px), Image.LANCZOS)
              resized.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
              resized.save(os.path.join(out_dir, "ic_launcher_foreground.png"), "PNG")

              # Circular cropped version for ic_launcher_round.png
              mask = Image.new("L", (px, px), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, px, px), fill=255)
              round_img = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              round_img.paste(resized, (0, 0), mask)
              round_img.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")

          # Replace Capacitor default splash screens with FX Arena Esports welcome artwork
          splash_src_path = "public/assets/aistudio/fx-welcome_31ecf10b.png"
          splash_src = Image.open(splash_src_path).convert("RGBA") if os.path.exists(splash_src_path) else base_img
          for splash_file in glob.glob(os.path.join(res_dir, "drawable*", "splash.png")):
              w, h = Image.open(splash_file).size
              canvas = Image.new("RGBA", (w, h), (5, 5, 8, 255))
              scale = min(w / splash_src.width, h / splash_src.height)
              nw, nh = max(1, int(splash_src.width * scale)), max(1, int(splash_src.height * scale))
              fitted = splash_src.resize((nw, nh), Image.LANCZOS)
              canvas.paste(fitted, ((w - nw) // 2, (h - nh) // 2), fitted)
              canvas.save(splash_file, "PNG")
          print("Applied FX Arena Esports launcher icons and splash screens successfully.")
          EOF

      - name: Configure Release SDK & Versioning
        run: |
          python3 - << 'EOF'
          import re

          vars_path = "android/variables.gradle"
          with open(vars_path, "r") as f:
              vars_txt = f.read()
          vars_txt = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 34", vars_txt)
          with open(vars_path, "w") as f:
              f.write(vars_txt)

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              gradle_txt = f.read()
          run_num = "${{ github.run_number }}"
          gradle_txt = re.sub(r"versionCode\s+\d+", f"versionCode {run_num}", gradle_txt)
          gradle_txt = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_num}"', gradle_txt)
          with open(gradle_path, "w") as f:
              f.write(gradle_txt)
          print(f"Configured targetSdkVersion=34, versionCode={run_num}, versionName=1.0.{run_num}")
          EOF

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Release APK not found at $UNSIGNED_APK"
            exit 1
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" app-release-aligned.apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/fx-release.keystore
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            KS_PASS=$(openssl rand -hex 16)
            KEY_ALIAS="fxarena"
            KEY_PASS="$KS_PASS"
            keytool -genkeypair -v \
              -keystore /tmp/fx-release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=FX Arena Esports, OU=Mobile, O=FX Arena Esports, L=Delhi, ST=DL, C=IN"
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/fx-release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out FX-Arena-Esports.apk \
            app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose FX-Arena-Esports.apk
          ls -lh FX-Arena-Esports.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FX-Arena-Esports-APK
          path: FX-Arena-Esports.apk

      - name: Publish Public APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FX Arena Esports v1.0.${{ github.run_number }}
          body: Official signed Release Android APK for FX Arena Esports. Uninstall any older version before installing FX-Arena-Esports.apk on your Android phone.
          files: FX-Arena-Esports.apk
          make_latest: true
